# Local development database only. Credentials below are local-only defaults, never use them in production.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: conecta
      POSTGRES_PASSWORD: conecta_local_only
      POSTGRES_DB: conecta
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conecta"]
      interval: 5s
      retries: 10
volumes:
  db-data:
